<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4ec">
<meta name="description" content="2026학년도 2학기 영미문학읽기 수업 포토부스 · 부산국제고등학교">
<title>영미문학읽기 포토부스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&display=swap">
<style>
  :root{
    --ground:#eef4ec;
    --surface:#f8fbf6;
    --tint:#dfeadb;
    --tint-strong:#cfe0ca;
    --green:#3f7a52;
    --green-press:#346845;
    --text:#1e2f24;
    --muted:#6a7f70;
    --shadow:0 18px 40px -18px rgba(38,72,48,.35);
    --font:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  img{max-width:100%}

  .app{height:100%;max-width:460px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0}
  h1{font-size:22px;font-weight:400;letter-spacing:-.01em;line-height:1.2;margin:2px 0 0}
  .term{font-size:12px;color:var(--muted);white-space:nowrap;background:var(--tint);padding:4px 10px;border-radius:999px}

  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:999px;padding:4px;gap:4px}
  .seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);padding:8px 0;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--green);box-shadow:0 2px 8px -2px rgba(38,72,48,.25)}

  .stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
  .strip{position:relative;height:100%;max-height:100%;aspect-ratio:1/3;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
  .strip canvas{display:block;width:100%;height:100%}
  .slot{position:absolute;left:5%;width:90%;height:20%;border:0;background:transparent;cursor:pointer;padding:0;border-radius:2px;transition:box-shadow .2s}
  .slot[data-i="0"]{top:1.667%}
  .slot[data-i="1"]{top:23.333%}
  .slot[data-i="2"]{top:45%}
  .slot.active{box-shadow:inset 0 0 0 3px rgba(63,122,82,.85)}

  .status{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:20px}
  .pip{width:7px;height:7px;border-radius:50%;background:var(--tint-strong)}
  .pip.on{background:var(--green)}
  .status .sep{width:8px}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{appearance:none;border:0;font:inherit;font-size:16px;padding:15px 8px;border-radius:14px;cursor:pointer;background:var(--tint);color:var(--text);transition:background .15s,transform .1s}
  .btn.primary{background:var(--green);color:#fff}
  .btn.primary:active{background:var(--green-press)}
  .btn.wide{grid-column:1/-1}
  .btn:active{transform:scale(.98)}
  .foot{display:flex;justify-content:center}
  .link{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;padding:2px 8px}
  .btn:focus-visible,.link:focus-visible,.seg button:focus-visible,.slot:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  /* Result */
  .sheet{position:fixed;inset:0;z-index:10;background:var(--ground);overflow-y:auto}
  .sheet-inner{max-width:460px;min-height:100%;margin:0 auto;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .sheet h2{font-size:20px;font-weight:400;margin:0}
  .result{width:min(260px,70vw);border-radius:6px;box-shadow:var(--shadow);-webkit-touch-callout:default}
  .tip{margin:0;font-size:13px;color:var(--muted);text-align:center;background:var(--tint);border-radius:12px;padding:10px 14px;width:100%}
  .tip b{color:var(--green);font-weight:400}
  .sheet .actions{width:100%}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:30;max-width:calc(100% - 32px)}
  .busy{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(238,244,236,.75);color:var(--green)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <p class="eyebrow">부산국제고등학교 · BIHS</p>
      <h1>영미문학읽기 포토부스</h1>
    </div>
    <span class="term">2026 · 2학기</span>
  </header>

  <div class="seg" role="group" aria-label="프레임 선택">
    <button id="opt-forest" data-frame="forest" aria-pressed="true">숲길 프레임</button>
    <button id="opt-tree" data-frame="tree" aria-pressed="false">나무 프레임</button>
  </div>

  <div class="stage">
    <div class="strip">
      <canvas id="preview" width="600" height="1800" aria-label="세 컷 프레임 미리보기"></canvas>
      <button class="slot" data-i="0" aria-label="1번 컷"></button>
      <button class="slot" data-i="1" aria-label="2번 컷"></button>
      <button class="slot" data-i="2" aria-label="3번 컷"></button>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="actions" id="actions"></div>
  <div class="foot"><button class="link" id="reset">처음부터</button></div>
</div>

<input type="file" id="cam" accept="image/*" capture="user" hidden>
<input type="file" id="album" accept="image/*" multiple hidden>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-inner">
    <h2 id="sheet-title">완성됐어요</h2>
    <img class="result" id="result" alt="완성된 영미문학읽기 세 컷 사진">
    <p class="tip" id="tip"><b>사진을 길게 눌러</b> ‘사진에 저장’을 선택하세요</p>
    <div class="actions">
      <button class="btn primary wide" id="save" hidden>휴대폰에 저장하기</button>
      <button class="btn" id="close">고치기</button>
      <button class="btn" id="again">새로 찍기</button>
    </div>
  </div>
</div>

<div class="busy" id="busy" hidden>사진 넣는 중…</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const SLOTS = [[30,30,540,360],[30,420,540,360],[30,810,540,360]];
  const W = 600, H = 1800, OUT = 2; // saved image: 1200×3600
  const FRAMES = { forest: 'frame-forest.png', tree: 'frame-tree.png' };
  const frameImgs = {};
  const photos = [null, null, null];
  let frameKey = 'forest', active = 0, resultBlob = null;

  const $ = s => document.querySelector(s);
  const preview = $('#preview'), cam = $('#cam'), album = $('#album');
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();

  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);
  }

  function drawCover(ctx, img, x, y, w, h){
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const s = Math.max(w / iw, h / ih), sw = w / s, sh = h / s;
    ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
  }

  function compose(ctx, scale, placeholders){
    ctx.save(); ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    SLOTS.forEach(([x, y, w, h], i) => {
      // 2px bleed under the frame edge so no seam shows
      if (photos[i]) { drawCover(ctx, photos[i], x - 2, y - 2, w + 4, h + 4); return; }
      ctx.fillStyle = '#f1f6ef'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
      if (placeholders){
        ctx.fillStyle = '#9db8a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '700 110px Gaegu, sans-serif';
        ctx.fillText(String(i + 1), x + w / 2, y + h / 2 - 16);
        ctx.font = '34px "Gowun Dodum", sans-serif';
        ctx.fillText('눌러서 찍기', x + w / 2, y + h / 2 + 64);
      }
    });
    if (frameImgs[frameKey]) ctx.drawImage(frameImgs[frameKey], 0, 0, W, H);
    ctx.restore();
  }

  function nextEmpty(from){
    for (let k = 0; k < 3; k++){ const i = (from + k) % 3; if (!photos[i]) return i; }
    return from;
  }

  function render(){
    compose(preview.getContext('2d'), 1, true);
    document.querySelectorAll('.slot').forEach(b => b.classList.toggle('active', +b.dataset.i === active));
    const filled = photos.filter(Boolean).length, full = filled === 3;
    $('#status').innerHTML = photos.map(p => `<span class="pip ${p ? 'on' : ''}"></span>`).join('') +
      `<span class="sep"></span>${full ? '칸을 누르면 그 컷만 다시 찍어요' : `${filled} / 3 컷`}`;
    $('#actions').innerHTML = full
      ? `<button class="btn" data-act="cam">${active + 1}번 다시 찍기</button>
         <button class="btn" data-act="album">앨범에서 바꾸기</button>
         <button class="btn primary wide" data-act="finish">완성하기</button>`
      : `<button class="btn primary" data-act="cam">${active + 1}번 컷 찍기</button>
         <button class="btn" data-act="album">앨범에서 고르기</button>`;
  }

  async function place(files){
    if (!files.length) return;
    const wasFull = photos.every(Boolean);
    $('#busy').hidden = false;
    try {
      let i = active;
      for (const f of files){
        const url = URL.createObjectURL(f);
        try { photos[i] = await loadImg(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
        if (photos.every(Boolean)) break;
        i = nextEmpty(i);
      }
      if (!photos.every(Boolean)) active = nextEmpty(active);
    } catch {
      toast('이 사진은 열 수 없어요. JPG나 PNG 사진으로 골라 주세요.');
    } finally {
      $('#busy').hidden = true;
      render();
      if (!wasFull && photos.every(Boolean)) finish();
    }
  }

  function finish(){
    const c = document.createElement('canvas');
    c.width = W * OUT; c.height = H * OUT;
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
    compose(ctx, OUT, false);
    $('#result').src = c.toDataURL('image/jpeg', 0.92);
    c.toBlob(b => { resultBlob = b; }, 'image/jpeg', 0.92);
    $('#sheet').hidden = false;
  }

  function resetAll(){
    photos.fill(null); active = 0; $('#sheet').hidden = true; render();
  }

  document.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cam'){ cam.value = ''; cam.click(); }
    else if (act === 'album'){ album.value = ''; album.click(); }
    else if (act === 'finish') finish();
  });

  document.querySelectorAll('.slot').forEach(b => b.addEventListener('click', () => { active = +b.dataset.i; render(); }));
  cam.addEventListener('change', () => place([...cam.files]));
  album.addEventListener('change', () => place([...album.files]));

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    frameKey = b.dataset.frame;
    document.querySelectorAll('.seg button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    render();
  }));

  // Save button only where the browser can actually save (a real site, not an embedded preview)
  if (!framed) $('#save').hidden = false;
  $('#tip').innerHTML = isMobile
    ? `${framed ? '' : '저장이 안 되면 '}<b>사진을 길게 눌러</b> ‘사진에 저장’ 또는 ‘이미지 다운로드’를 선택하세요`
    : `${framed ? '' : '저장이 안 되면 '}<b>사진에서 오른쪽 클릭</b> → ‘이미지를 다른 이름으로 저장’`;

  $('#save').addEventListener('click', async () => {
    if (!resultBlob) return;
    const name = 'BIHS-영미문학-포토부스-' + Date.now() + '.jpg';
    const file = new File([resultBlob], name, { type: 'image/jpeg' });
    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(resultBlob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('다운로드를 시작했어요');
  });

  $('#reset').addEventListener('click', resetAll);
  $('#again').addEventListener('click', resetAll);
  $('#close').addEventListener('click', () => { $('#sheet').hidden = true; });

  render();
  Promise.all(Object.entries(FRAMES).map(([k, src]) => loadImg(src).then(i => { frameImgs[k] = i; })))
    .then(() => document.fonts && document.fonts.ready)
    .then(render)
    .catch(() => toast('프레임을 불러오지 못했어요. 새로고침해 주세요.'));
})();
</script>
</body>
</html>
